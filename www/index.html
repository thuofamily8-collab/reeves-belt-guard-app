<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reeves Belt Guard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .logo {
            width: 140px; height: 140px; object-fit: contain;
            filter: drop-shadow(0 8px 30px rgba(0, 198, 255, 0.6));
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .brand { font-size: 26px; font-weight: 900; letter-spacing: 3px; color: #00c6ff; text-shadow: 0 0 25px rgba(0, 198, 255, 0.6); margin-top: 20px; }
        .brand-sub { font-size: 13px; font-weight: 700; letter-spacing: 5px; color: #fff; opacity: 0.9; margin-top: 6px; }
        .tagline { font-size: 11px; color: #00c6ff; letter-spacing: 2px; text-transform: uppercase; margin-top: 15px; opacity: 0.75; }
        .loader { margin-top: 40px; width: 40px; height: 40px; border: 3px solid rgba(0, 198, 255, 0.2); border-top-color: #00c6ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <img src="assets/logo.png" alt="Reeves Belt" class="logo" onerror="this.style.display='none'">
    <div class="brand">REEVES BELT</div>
    <div class="brand-sub">SECURE 360</div>
    <div class="tagline">Guard Mobile App</div>
    <div class="loader"></div>

    <script>
        setTimeout(function() {
            // Just redirect to the live server - the app loads pajhub.co.ke
            window.location.href = 'https://www.pajhub.co.ke/login.php';
        }, 1500);
    </script>
</body>
</html>
